; ============================================================================
;  ArchBB 1.83 — platformio.ini · FASE 5 (persistenza microSD + batteria)
;  Cesare Pagura · Padova/Noale IT · 20 luglio 2026
;  Board: Waveshare ESP32-S3-Touch-LCD-1.83  (ESP32-S3R8, 8MB PSRAM OCTAL)
; ----------------------------------------------------------------------------
;  Filosofia di questo file: e' il FONDAMENTO. Se sbaglia qui, nulla si accende.
;  Due punti sono critici e non deducibili "a occhio":
;    1) memory_type = qio_opi  -> la 1.83 monta PSRAM OCTAL (suffisso R8).
;       Sulla 1.69 era qio_qspi; qui, mettere qspi su hardware octal = BOOT LOOP.
;       E' lo specchio esatto del vecchio problema, invertito.
;    2) Config TFT_eSPI passata via build_flags (-D...) e NON via User_Setup.h.
;       Motivo: i -D nel platformio.ini sopravvivono agli update/reinstall della
;       libreria. Un User_Setup.h dedicato verrebbe cancellato al primo update.
;       Per un progetto versionato e a lungo termine come ArchBB, e' la scelta
;       robusta. (Confermato dalla doc ufficiale TFT_eSPI.)
; ============================================================================

[platformio]
default_envs = archbb_183_touchcal

; ----------------------------------------------------------------------------
;  Ambiente unico di Fase 1
; ----------------------------------------------------------------------------
[env:archbb_183_touchcal]
platform  = espressif32
board     = esp32-s3-devkitc-1     ; base generica S3; i parametri veri sono sotto
framework = arduino

; --- Toolchain / core -------------------------------------------------------
; Il briefing chiede core "esp32 by Espressif 3.0.5". In PlatformIO il core
; Arduino e' legato alla versione di piattaforma. Lascio la piattaforma libera
; di risolvere una 3.0.x recente; se vuoi pinnare ESATTAMENTE, scommenta la riga
; platform_packages qui sotto adattandola alla release che usi.
; platform_packages =
;     platformio/framework-arduinoespressif32 @ 3.0.5

monitor_speed = 115200
; Evita che l'apertura/chiusura del monitor (e il CTRL-C) resetti la scheda
; toggolando DTR/RTS. Sull'S3 con USB CDC nativo queste linee possono pilotare
; reset/boot: forzandole a 0 il monitor non tocca piu' il reset.
monitor_dtr = 0
monitor_rts = 0
upload_speed  = 921600

; --- Memoria: QUI vive la trappola del boot loop ----------------------------
; ESP32-S3R8 = 8MB PSRAM OCTAL. La flash e' Quad (qio), la PSRAM e' Octal (opi).
board_build.arduino.memory_type = qio_opi
board_build.flash_mode          = qio
board_build.psram_type          = opi
board_upload.flash_size         = 16MB          ; 1.83 = 16MB flash (N16R8)
board_upload.maximum_size       = 16777216
board_build.partitions          = default_16MB.csv

; --- Librerie ---------------------------------------------------------------
lib_deps =
    bodmer/TFT_eSPI    @ ^2.5.43
    lewisxhe/SensorLib @ ^0.3.1        ; driver QMI8658C (stesso della 1.69)
    lewisxhe/XPowersLib @ ^0.2.6       ; FASE 5: PMU AXP2101 (batteria) — stesso autore
    h2zero/NimBLE-Arduino @ ^1.4.1     ; FASE 7: stack BLE (STESSA versione della 1.69)
; NB: le librerie SD, FS e SPI sono BUILT-IN nel core Arduino-ESP32: non vanno
;     dichiarate in lib_deps (verrebbero cercate nel registry e non trovate).
;     Il modulo sd_storage le include direttamente (#include <SD.h> ecc.).

; --- Build flags ------------------------------------------------------------
build_flags =
    ; ---------- PSRAM / USB nativo S3 --------------------------------------
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1              ; USB nativo S3 (non OTG bridge)
    -D ARDUINO_USB_CDC_ON_BOOT=1       ; "USB CDC On Boot" -> Serial su USB
    -D CORE_DEBUG_LEVEL=0              ; produzione: silenzio (S3+HWCDC non ama i log nel loop)

    ; ================= CONFIG TFT_eSPI (sostituisce User_Setup.h) ==========
    -D USER_SETUP_LOADED=1             ; dico a TFT_eSPI: uso i miei -D, non i suoi
    -D ST7789_DRIVER=1                 ; controller ST7789V2

    ; ---- Geometria pannello 1.83: 240 x 284, offset y=20 -----------------
    ; ATTENZIONE: TFT_WIDTH/HEIGHT sono la finestra VISIBILE. Il controller
    ; resta 240x320; l'offset y=20 ritaglia la finestra alta. Su TFT_eSPI
    ; l'offset per lo ST7789 e' gestito internamente in base a WIDTH/HEIGHT +
    ; rotation; per il ritaglio fine y=20 useremo setViewport/offset nel driver
    ; (vedi display.cpp). Qui dichiaro le dimensioni logiche.
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=284
    ; CGRAM_OFFSET: SENZA questa define TFT_eSPI ignora WIDTH/HEIGHT non-nativi
    ; e usa i default 240x320 -> comparirebbe la riga di garbage (rischio §6).
    ; E' il flag che "abilita" il concetto stesso di offset per lo ST7789.
    -D CGRAM_OFFSET=1

    ; ---- Colore: il BSP ufficiale fa invert_color(true) ------------------
    ; Se lo sfondo esce BIANCO invece che nero, questo flag e' la causa/cura.
    -D TFT_INVERSION_ON=1

    ; ---- Ordine colore: CORRETTO DAL CAMPO -> il pannello e' BGR ----------
    ; Fase 1, prima flash: "ArchBB" (ciano) usciva GIALLO e il pallino centrale
    ; (rosso) usciva BLU. Ciano->giallo e rosso->blu = firma dell'ordine colore
    ; invertito: inviavo RGB, il pannello legge BGR. "I dati comandano": il BSP
    ; dichiarava RGB ma l'hardware reale vuole BGR. Corretto.
    -D TFT_RGB_ORDER=TFT_BGR       ; era TFT_RGB (sbagliato sul pannello reale)

    ; ---- Pin display 1.83 (BSP v2.0.0) -----------------------------------
    ; DC/CS/SCK/MOSI IDENTICI alla 1.69 (4/5/6/7).
    ; RST e BL CAMBIANO: 1.69 aveva RST=8/BL=15 -> qui RST=38/BL=40.
    -D TFT_MISO=-1                 ; display write-only: nessun MISO
    -D TFT_MOSI=7
    -D TFT_SCLK=6
    -D TFT_CS=5
    -D TFT_DC=4
    -D TFT_RST=38                  ; <-- CAMBIATO dalla 1.69 (era 8)
    ; ---- BACKLIGHT: NON si dichiara a TFT_eSPI. LEGGERE PRIMA DI RIMETTERLO --
    ;  Fino alla 24a qui c'erano -D TFT_BL=40 e -D TFT_BACKLIGHT_ON=HIGH, e il
    ;  primo campo con la 24a ha mostrato perche' sono veleno: TFT_eSPI::init()
    ;  finisce con
    ;        pinMode(TFT_BL, OUTPUT); digitalWrite(TFT_BL, TFT_BACKLIGHT_ON);
    ;  cioe' RIPRENDE il pin e lo inchioda a HIGH. Il digitalWrite riporta la
    ;  matrice GPIO al modo semplice e STACCA il canale LEDC che avevamo appena
    ;  agganciato: da quel momento ogni ledcWrite() scrive nel vuoto e la
    ;  retroilluminazione resta al 100% per sempre, in silenzio.
    ;
    ;  Sintomo osservato in campo: nessuna attenuazione a 40 s, e a 100 s uno
    ;  schermo "nero ma con un leggero chiarore" — il pannello in sleep con la
    ;  retro ancora accesa dietro.
    ;
    ;  Regola §4.1 applicata a un piedino: UN SOLO PROPRIETARIO. Il backlight
    ;  appartiene a display.cpp, quindi TFT_eSPI non deve nemmeno sapere che
    ;  esiste. Il pin si dichiara con un nome NOSTRO.
    -D ARCHBB_BL_PIN=40            ; <-- CAMBIATO dalla 1.69 (era 15)

    ; ---- SPI: bus e frequenza --------------------------------------------
    ; Il BSP usa 24 MHz come punto di partenza. TFT_eSPI regge molto di piu su
    ; S3, ma partiamo prudenti: prima "acceso e pulito", poi si alza.
    -D SPI_FREQUENCY=24000000
    -D USE_HSPI_PORT=1             ; su S3 va bene; evita conflitti col bus di sistema

    ; ---- Font caricati (banco di prova scoring) --------------------------
    -D LOAD_GLCD=1                 ; font 1 base 8px
    -D LOAD_FONT2=1                ; 16px
    -D LOAD_FONT4=1                ; 26px  (titoli scoring)
    -D LOAD_FONT6=1                ; 48px  (numeri grandi)
    -D LOAD_FONT7=1                ; 7-seg 48px
    -D LOAD_GFXFF=1                ; FreeFonts
    -D SMOOTH_FONT=1

    ; ================= FASE 2 — TOUCH CST816 + I2C =========================
    ; Il CST816 e' su I2C (0x15) e usa due GPIO di controllo (RST, INT).
    ; TRAPPOLA (dal foglio IO): sulla 1.69 era TP_RST=13/TP_INT=14. Sulla 1.83
    ; i numeri 13/14 SI INCROCIANO: INT=13, SDA=15, SCL=14. Non trascinare i
    ; vecchi define. Il bus I2C 15/14 e' condiviso (IMU, RTC, PMU, codec...).
    -D ARCHBB_I2C_SDA=15
    -D ARCHBB_I2C_SCL=14
    -D ARCHBB_TP_RST=39
    -D ARCHBB_TP_INT=13
    -D ARCHBB_TP_ADDR=0x15         ; indirizzo 7-bit CST816

    ; ================= FASE 4a — IMU QMI8658 (bus I2C CONDIVISO) ===========
    ; L'IMU (0x6B) sta sullo STESSO bus del touch: SDA=15/SCL=14. NON serve un
    ; secondo Wire.begin() (lo fa gia' touchInit()). Sulla 1.69 l'IMU aveva un
    ; pin INT su GPIO14; QUI 14 e' SCL, quindi NON esiste un IMU_INT_PIN: usiamo
    ; il POLLING PURO di getDataReady() (SensorLib legge il registro STATUS via
    ; I2C). Un pin in meno da sbagliare, comportamento identico. I valori di pin
    ; e indirizzo IMU sono costanti C++ in config.h (IMU_I2C_SDA/SCL/ADDR); non
    ; servono -D qui perche' il modulo IMU non li prende dai build_flags.
    ;
    ; DEBUG: per attivare i log seriali dei moduli IMU/trigger, scommentare la
    ; riga sotto. ATTENZIONE (S3+HWCDC): col monitor CHIUSO i log restano
    ; best-effort (setTxTimeoutMs(0) nel main); non lasciarlo attivo in campo.
    ; -D ARCHBB_DEBUG=1

    ; ================= FASE 5 — microSD (bus SPI DEDICATO) + BATTERIA =======
    ; microSD (dal pinout ufficiale 1.83-S3): MOSI=1, SCK=2, MISO=3, CS=42.
    ; E' un bus SPI TUTTO SUO (host FSPI), separato dal display (HSPI, 6/7):
    ; nessuna contesa. I pin sono costanti C++ in sd_storage.h (SD_PIN_*), non
    ; -D, perche' solo quel modulo li usa. La card e' FAT32.
    ;
    ; Batteria: PMU AXP2101 sul bus I2C GIA' condiviso (SDA=15/SCL=14, come IMU
    ; e touch). Letta via XPowersLib (indirizzo 0x34). battery_init() NON chiama
    ; Wire.begin(): usa il bus gia' attivo. Nessun pin nuovo.

    ; ================= FASE 6 — CONFIG in NVS ==============================
    ; I parametri (trigger, finestre, montaggio, offset calibrazione, massa arco)
    ; vivono in NVS via Preferences (BUILT-IN nel core, non in lib_deps). La
    ; struct Config e' fonte di verita' in RAM, caricata al boot con versione +
    ; checksum (migrazione/anti-corruzione). Editing on-device: sola lettura +
    ; ripristino default (voce CONFIG nel menu d'avvio). Editing valori: via BLE.

; ----------------------------------------------------------------------------
;  RIMEDIO DI RISERVA (non attivo): se il primo flash va in boot loop nonostante
;  memory_type corretto, alcuni report indicano il flash_mode sovrascritto in
;  build. In quel caso forzare via sdkconfig:
;    board_build.sdkconfig_options = CONFIG_ESPTOOLPY_FLASHMODE_QIO=y
;  Lo lascio documentato ma disattivato per non complicare il bring-up.
; ----------------------------------------------------------------------------

; ----------------------------------------------------------------------------
;  ENV DI DEBUG — per il TEST AL TAVOLINO (Fase 4c)
; ----------------------------------------------------------------------------
;  Eredita TUTTO dall'env principale e in piu' definisce ARCHBB_DEBUG=1, che
;  accende:
;    - i log DBG() dei moduli (IMU/trigger)
;    - la RIGA CSV seriale del DIAG ANGOLI (assi grezzi + cant/alzo dei 4
;      montaggi, ~1/s), pensata per validare i segni al tavolino col monitor.
;
;  USO:
;    campo    -> pio run -e archbb_183_touchcal -t upload   (muto, come sempre)
;    tavolino -> pio run -e archbb_183_debug     -t upload   (CSV sulla seriale)
;
;  ATTENZIONE (S3+HWCDC): non lasciare l'env debug in campo. Col monitor chiuso
;  i print sono best-effort (setTxTimeoutMs(0) nel main li rende non bloccanti),
;  ma la disciplina del progetto resta \"in produzione, muti\".
[env:archbb_183_debug]
extends = env:archbb_183_touchcal
build_flags =
    ${env:archbb_183_touchcal.build_flags}
    -D ARCHBB_DEBUG=1

; ----------------------------------------------------------------------------
;  ENV DI TEST MONTAGGI — firmware SEPARATO (caratterizzazione IMU + matrici)
; ----------------------------------------------------------------------------
;  Compila main_mount_test.cpp AL POSTO di main.cpp per leggere i grezzi dell'IMU
;  in pose note (dove punta ogni asse fisico) e vedere cant/alzo di ogni
;  montaggio sullo stesso campione. Output: seriale + display.
;
;  COME funziona la selezione del main (robusta, senza src_filter con path
;  relativi che PlatformIO gestisce male): entrambi i main vivono in src/, ma
;  sono avvolti in guardie di compilazione opposte:
;    - main.cpp            e' attivo #ifndef ARCHBB_MOUNT_TEST
;    - main_mount_test.cpp e' attivo #ifdef  ARCHBB_MOUNT_TEST
;  Questo env definisce -D ARCHBB_MOUNT_TEST=1 -> compila il test, il main di
;  produzione diventa vuoto. Escludiamo solo ble_service.cpp (referenzia
;  g_shutdown, definito in main.cpp che qui e' vuoto; e il test non usa il BLE).
;
;  USO (IMPORTANTE: seleziona ESPLICITAMENTE questo env, il default e' produzione):
;    pio run -e archbb_183_mount_test -t upload
;    In VS Code: barra di stato PlatformIO -> "env:archbb_183_mount_test" prima
;    di premere Upload; NON usare il pulsante ▶ generico (usa il default).
;    Poi: monitor seriale 115200; tocca il display per commutare vista.
[env:archbb_183_mount_test]
extends = env:archbb_183_touchcal
build_src_filter =
    +<*>
    -<ble_service.cpp>
build_flags =
    ${env:archbb_183_touchcal.build_flags}
    -D ARCHBB_MOUNT_TEST=1

; ----------------------------------------------------------------------------
;  ENV DIAGNOSTICA SCOCCO REALE — peak-hold + log continuo su SD
; ----------------------------------------------------------------------------
;  Serve a catturare la firma di uno SCOCCO VERO sulla 1.83, che non abbiamo mai
;  registrato (il trigger non scatta con la freccia, quindi nessun burst).
;  Compila main_raw_diag.cpp al posto del main di produzione, con lo stesso
;  meccanismo a guardie dell'env mount_test.
;
;  Registra OGNI campione senza alcun trigger di mezzo, e mostra a schermo i
;  picchi |ax| |ay| |az| dall'ultimo azzeramento: si tira UNA freccia e si
;  leggono i tre numeri. Riferimento dai 44 tiri della 1.69: picco |az| ~38 m/s^2.
;
;  USO:
;    pio run -e archbb_183_raw_diag -t upload
;    (in VS Code: seleziona l'ambiente nella barra di stato PRIMA di Upload)
[env:archbb_183_raw_diag]
extends = env:archbb_183_touchcal
build_src_filter =
    +<*>
    -<ble_service.cpp>
build_flags =
    ${env:archbb_183_touchcal.build_flags}
    -D ARCHBB_RAW_DIAG=1

; ----------------------------------------------------------------------------
;  ENV REGISTRATORE SCOCCO — diagnostica "il tiro vero non viene rilevato"
; ----------------------------------------------------------------------------
;  Registra OGNI campione IMU in PSRAM (senza trigger, senza soglie) e lo salva
;  su microSD; mostra a schermo il PEAK-HOLD di |ax| |ay| |az|. Serve a vedere
;  cosa legge DAVVERO il sensore quando parte la freccia: finora tutti i burst
;  salvati erano scuotimenti a mano, e senza il dato di uno scocco vero ogni
;  ipotesi resta infalsificabile.
;
;  ODR 500 Hz (contro i 250 della produzione): doppia risoluzione temporale e
;  doppia banda passante del filtro interno del QMI8658 — se lo scocco fosse ben
;  visibile a 500 e non a 250, sarebbe la prova che ODR/filtro sono la causa.
;
;  USO (selezionare ESPLICITAMENTE l'env, il default e' produzione):
;    pio run -e archbb_183_shotrec -t upload
;    pio device monitor -b 115200
[env:archbb_183_shotrec]
extends = env:archbb_183_touchcal
build_src_filter =
    +<*>
    -<ble_service.cpp>
build_flags =
    ${env:archbb_183_touchcal.build_flags}
    -D ARCHBB_SHOT_REC=1
    -D ARCHBB_DEBUG=1

; ----------------------------------------------------------------------------
;  RITIRATO IN FASE 18 — env archbb_183_assi (main_diag_assi.cpp)
; ----------------------------------------------------------------------------
;  Serviva a decidere QUALE dei quattro montaggi descrivesse la scheda sul riser,
;  provando le otto combinazioni su tre pose statiche. La domanda e' chiusa:
;  l'ha risolta l'ispezione fisica del chip (briefing 30/07), dopo che quattro
;  tentativi per inferenza avevano dato quattro risposte diverse. Tenere in vita
;  uno strumento che ha gia' sbagliato tre volte su quattro non e' prudenza: e'
;  un invito a riaprire la questione col metodo che non funziona.
;
;  La verifica che serve OGGI e' un'altra — "i segni sono quelli attesi?" — ed e'
;  il CLINOMETRO (voce 3 del menu d'avvio, src/clino.cpp), che gira nel firmware
;  di produzione e non richiede un ambiente separato. Il file main_diag_assi.cpp
;  resta nella storia di git: se servisse, si recupera da li'.
; ----------------------------------------------------------------------------
